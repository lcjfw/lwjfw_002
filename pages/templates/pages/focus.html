y:block;font-size:14px;overflow-wrap:anywhere}.card small{display:block;color:#526470;overflow-wrap:anywhere}.card .category{font-size:10px;background:#fff9;display:inline-block;padding:1px 5px;border-radius:4px;margin-bottom:4px}.faded{opacity:.18}.sidebar{padding:20px}.sidebar h2{font-size:17px}.today-item{border-bottom:1px solid var(--line);padding:14px 0}.today-item:last-child{border:0}.today-item b{display:block;font-size:14px;overflow-wrap:anywhere}.today-item small{font-size:12px;color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted);font-size:14px}.tip{font-size:12px;line-height:1.8;color:var(--muted);padding-top:14px}.storage-note{margin-top:24px;font-size:12px;color:var(--muted)}.list-section{padding:20px}.day-title{font-size:16px;margin:24px 0 12px}.day-title:first-child{margin-top:0}.list-card{display:grid;grid-template-columns:125px 1fr auto;gap:18px;align-items:start;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--t);padding:16px;border-radius:9px;margin-bottom:10px}.list-card b{display:block;overflow-wrap:anywhere}.list-card p{margin:4px 0;color:#526470;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.list-card time{font-size:13px;color:#526470}.legend{display:flex;gap:14px;padding:13px 18px;font-size:12px;color:var(--muted);flex-wrap:wrap;border-top:1px solid var(--line)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--c)}dialog{border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 80px #1234;padding:0;width:min(560px,calc(100% - 28px));max-height:90dvh;color:var(--ink)}dialog::backdrop{background:#142c3e88;backdrop-filter:blur(3px)}.dialog-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dialog-head h2{margin:0}.dialog-body{padding:22px 24px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #c6d3dc;border-radius:7px;padding:10px;background:white;color:var(--ink)}.field textarea{resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:12px}.error{background:#ffedf0;color:#a1263c;padding:12px;border-radius:8px;font-size:14px;margin-bottom:15px}.settings-times{display:grid;gap:9px;margin:12px 0 20px}.time-row{display:grid;grid-template-columns:55px 1fr 12px 1fr;align-items:center;gap:8px;font-size:13px}.time-row input{min-width:0;padding:7px;width:100%;border:1px solid var(--line);border-radius:6px}.backupbar{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.notice{padding:14px 18px;background:#fff3d9;border:1px solid #ead39a;border-radius:9px;font-size:14px;margin-bottom:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:10;border-radius:10px;padding:13px 20px;background:#193b32;color:white;max-width:90%;box-shadow:var(--shadow);font-size:14px}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:1100px){.layout{grid-template-columns:1fr}.sidebar{display:none}}@media(max-width:600px){nav{padding:14px 16px;align-items:flex-start}.brand{font-size:17px}.brand small{font-size:9px}nav .actions button{font-size:13px;padding:8px}.mark{padding:4px 9px;font-size:20px}main{padding:24px 16px}.intro{align-items:flex-start;flex-direction:column;gap:10px}.stats{gap:8px}.stat{padding:12px;display:block}.stat span{font-size:11px;display:block}.stat strong{font-size:24px}.toolbar .search{width:100%;min-width:0}.list-section{padding:14px}.list-card{grid-template-columns:1fr auto;gap:8px}.list-card time{grid-column:1/-1}.list-card button{font-size:12px;padding:6px 9px}.dialog-body{padding:18px}.dialog-head{padding:16px 18px}.cols{gap:9px}.backupbar button{font-size:13px}}@media print{@page{size:A4 landscape;margin:10mm}header,.no-print,.sidebar,.backupbar,.storage-note,.toast,dialog,.tip,.notice{display:none!important}body{background:white;color:black}main{padding:0;max-width:none}.intro{margin-bottom:10px}.intro h1{font-size:24px}.intro .badge{background:white;color:black;padding:0}.stats{margin:0 0 12px;gap:5px}.stat{padding:4px;border:0;display:flex;justify-content:flex-start;gap:10px}.stat strong{font-size:16px}.layout{display:block}.panel{box-shadow:none;border-radius:0;border:0}.scroll{overflow:visible}.table{min-width:0;width:100%}.table th,.table td{padding:3px}.table td{height:45px}.table thead th{position:static;font-size:12px}.table th:first-child{width:70px}.table tbody th{font-size:10px}.table th small{font-size:8px}.slotadd{display:none}.card{padding:5px;min-height:38px;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.card b{font-size:11px}.card small{font-size:9px}.faded{opacity:1}.legend{font-size:9px;padding:7px}.list-card{break-inside:avoid}.today-label{background:none;color:black}}

.hubbar{background:#1c3659;color:white}.hubinner{max-width:1440px;padding:18px 28px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}.hubtitle{font-size:16px;font-weight:700}.hubtitle small{display:block;font-size:11px;font-weight:400;opacity:.75;letter-spacing:1px;margin-top:4px}.hublinks{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:#ffffff14;border-radius:7px}.hublinks a{color:white;font-size:14px;padding:8px 12px;border-radius:4px;white-space:nowrap}.hublinks a[aria-current=page]{background:white;color:#1c3659}.personal-note{font-size:13px;line-height:1.7;background:#eaf1f9;color:#315574;padding:12px 16px;border:1px solid #cbdbea;border-radius:7px;margin-bottom:22px}@media(max-width:700px){.hubinner{padding:16px;flex-direction:column;align-items:flex-start;gap:12px}.hubtitle{font-size:15px}.hublinks a{padding:8px 10px;font-size:13px}}@media print{.hubbar,.personal-note{display:none!important}}

:root{--bg:#f6f5ef;--ink:#283e32;--accent:#2c6951;--line:#dce2d5;--soft:#eaf0e0}.hubbar{background:#234c3c;color:white}.hubtitle,.hubtitle small,.hublinks a{color:#fff}.hublinks a[aria-current=page]{background:#dce8cc;color:#234c3c}header{background:#f6f5ef}.mark{background:#234c3c}.intro{background:#e9eddb;padding:24px;border-radius:16px}

.learning{margin-top:30px;display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:20px}.learning .panel{padding:24px}.taskform{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.taskform input,.taskform select{border:1px solid var(--line);padding:10px;border-radius:8px;min-width:0}.taskform input[name=title]{flex:1;min-width:180px}.task-row{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center}.task-row .tasktext{flex:1;overflow-wrap:anywhere}.task-row small{display:block;color:var(--muted);margin-top:4px}.task-row.done .tasktext{text-decoration:line-through;opacity:.55}.task-row.overdue small{color:#b83c46}.clock{font-size:62px;font-weight:800;letter-spacing:-3px;margin:20px 0}.focusbox{background:#eaf0df!important}.progress-track{background:#e3e8dc;height:8px;border-radius:8px;overflow:hidden;margin:12px 0}.progress-track span{display:block;background:#51815c;height:100%}.taskfilters{display:flex;gap:8px;flex-wrap:wrap}.taskfilters button[aria-pressed=true]{background:#245b48;color:#fff}@media(max-width:850px){.learning{grid-template-columns:1fr}}@media print{.learning{display:block}.taskform,.taskfilters,.focusbox{display:none}.task-row button{display:none}}

.focus-layout{max-width:820px;margin:30px auto}.timer-card{text-align:center;padding:45px 25px;background:#eaf0df;border:1px solid #dce2d5;border-radius:24px}.timer-card .actions{justify-content:center}.timer-card .clock{font-size:clamp(78px,16vw,140px);font-variant-numeric:tabular-nums;line-height:1.2;margin:24px 0}.mode-switch{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.mode-switch button[aria-pressed=true]{background:#245b48;color:white}.focus-note{max-width:520px;margin:25px auto 0;line-height:1.8;color:var(--muted)}#focusStatus{min-height:28px;margin-top:22px}#focusTask{width:100%;max-width:460px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;margin:18px auto 0;display:block}.timer-card button{min-width:100px}.focus-layout h1{font-size:32px}
</style></head><body><div class="hubbar"><div class="hubinner"><div class="hubtitle">課間｜課表與選課資訊<small>ONE THING AT A TIME</small></div><nav class="hublinks" style="padding:4px;margin:0"><a href="/">個人課表</a><a href="/courses/">選課資訊</a><a href="/focus/" aria-current="page">專注計時</a></nav></div></div><main class="focus-layout"><p class="eyebrow">MAKE ROOM FOR FOCUS</p><h1>留一段時間，做好一件事。</h1><p class="sub" style="margin:14px 0 28px">把課表安排好，再給眼前的學習一段完整時間。</p><section class="timer-card"><div class="mode-switch" id="modes"><button id="workMode" aria-pressed="true">專注 25 分鐘</button><button id="restMode" aria-pressed="false">休息 5 分鐘</button></div><label for="focusTask" class="sub" style="display:block;margin-top:25px">這段時間，想完成什麼？</label><input id="focusTask" maxlength="100" placeholder="例如：複習微積分第一章"><form id="durationForm" style="margin:24px auto 0;max-width:440px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><label>專注（分鐘）<input id="workMinutes" type="number" min="1" max="180" step="1" required value="25" style="display:block;width:120px;padding:9px;border:1px solid var(--line);border-radius:8px"></label><label>休息（分鐘）<input id="restMinutes" type="number" min="1" max="60" step="1" required value="5" style="display:block;width:120px;padding:9px;border:1px solid var(--line);border-radius:8px"></label><button type="submit">套用時間</button></form><p id="durationMessage" role="status" class="sub" style="margin-top:12px">專注可設 1–180 分鐘，休息可設 1–60 分鐘。</p><div class="clock" id="focusClock" role="timer" aria-label="剩餘時間">25:00</div><div class="actions"><button id="focusStart" class="primary">開始專注</button><button id="focusReset">重設</button></div><p id="focusStatus" role="status">準備好就開始，專心完成眼前的一件事。</p></section><p class="focus-note">計時結束後，會提示你切換專注或休息，按下開始才會進入下一段。切換到其他頁面或重新整理會重設計時，請保持此頁開啟。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let workMinutes=25,restMinutes=5;const SETTINGS_KEY='ja_focus_durations_v1';
function valid(w,r){return Number.isInteger(w)&&w>=1&&w<=180&&Number.isInteger(r)&&r>=1&&r<=60}
try{const raw=localStorage.getItem(SETTINGS_KEY);if(raw){const x=JSON.parse(raw);if(valid(x.work,x.rest)){workMinutes=x.work;restMinutes=x.rest}}}catch{}
$('workMinutes').value=workMinutes;$('restMinutes').value=restMinutes;
let mode='work',remaining=workMinutes*60,deadline=0,running=false,interval=null;const duration=()=>60*(mode==='work'?workMinutes:restMinutes);
function paint(){const text=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('focusClock').textContent=text;document.title=(running?text+' · ':'')+'課間｜專注計時';$('workMode').textContent='專注 '+workMinutes+' 分鐘';$('restMode').textContent='休息 '+restMinutes+' 分鐘';$('workMode').setAttribute('aria-pressed',String(mode==='work'));$('restMode').setAttribute('aria-pressed',String(mode==='rest'));$('focusStart').textContent=running?'暫停':remaining===duration()?(mode==='work'?'開始專注':'開始休息'):'繼續'}
function stop(){clearInterval(interval);interval=null;running=false}
function update(){if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){const old=mode;stop();mode=old==='work'?'rest':'work';remaining=duration();$('focusStatus').textContent=old==='work'?'專注完成！按「開始休息」，休息 '+restMinutes+' 分鐘。':'休息結束！準備好再開始下一段專注。'}paint()}
function reset(next=mode){stop();mode=next;remaining=duration();$('focusStatus').textContent=mode==='work'?'準備好就開始，專心完成眼前的一件事。':'放鬆眼睛、起身活動一下。';paint()}
function switchMode(next){if(next===mode)return;if(running&&!confirm('切換模式會重設目前計時，確定切換？'))return;reset(next)}
$('workMode').onclick=()=>switchMode('work');$('restMode').onclick=()=>switchMode('rest');$('focusStart').onclick=()=>{if(running){update();if(!running)return;stop();$('focusStatus').textContent='已暫停，準備好再繼續。';paint();return}deadline=Date.now()+remaining*1000;running=true;interval=setInterval(update,250);$('focusStatus').textContent=mode==='work'?'專注中，慢慢完成眼前的一件事。':'休息中，讓自己充電。';paint()};$('focusReset').onclick=()=>{if(running&&!confirm('確定重設這段計時？'))return;reset()};$('durationForm').onsubmit=e=>{e.preventDefault();const w=Number($('workMinutes').value),r=Number($('restMinutes').value);if(!valid(w,r)){$('durationMessage').textContent='請輸入整數：專注 1–180 分鐘、休息 1–60 分鐘。';return}if((running||remaining!==duration())&&!confirm('套用新時間會重設目前計時，確定套用？'))return;workMinutes=w;restMinutes=r;reset();try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({work:w,rest:r}));$('durationMessage').textContent='時間設定已儲存，下次開啟仍會保留。'}catch{$('durationMessage').textContent='時間已套用；此瀏覽器無法保存，關閉後需重新設定。'}};document.addEventListener('visibilitychange' ,()=>{if(!document.hidden)update()});paint();
})();
</script></body></html>
