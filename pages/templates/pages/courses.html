const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(c,q,cat,day){return (cat==='all'||c.category===cat)&&(day==='all'||c.day_of_week===Number(day))&&[c.name,c.teacher,c.classroom,c.code].some(v=>v.toLowerCase().includes(q.toLowerCase()))}
function render(){const list=COURSES.filter(c=>matches(c,$('courseSearch').value.trim(),$('category').value,$('weekday').value));$('result').textContent=`共 ${list.length} 門課程`;$('catalog').innerHTML=list.length?list.map(c=>`<article><div><span class="badge ${c.category==='REQUIRED'?'required':'elective'}">${c.category==='REQUIRED'?'必修':'選修'}</span></div><small>${esc(c.code)}</small><h2>${esc(c.name)}</h2><div class="meta"><p>教師｜${esc(c.teacher)}</p><p>教室｜${esc(c.classroom)}</p><p>星期${'一二三四五六日'[c.day_of_week-1]}｜第 ${c.start_period}–${c.end_period} 節</p><p>${TIMES[c.start_period-1].slice(0,5)}–${TIMES[c.end_period-1].slice(-5)}</p></div><details><summary>查看課程簡介</summary><p>${esc(c.description)}</p></details></article>`).join(''):'<p class="empty">沒有符合的課程，請調整篩選條件。</p>'}
$('courseSearch').oninput=render;$('category').onchange=render;$('weekday').onchange=render;$('clearFilters').onclick=()=>{$('courseSearch').value='';$('category').value='all';$('weekday').value='all';render()};render();
</script></body></html>
